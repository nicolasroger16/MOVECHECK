name: Déployer les fonctions Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configurer les secrets des fonctions
        run: |
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            FROM_EMAIL="${{ secrets.FROM_EMAIL || 'MoveCheck <onboarding@resend.dev>' }}" \
            SITE_URL="${{ secrets.SITE_URL || 'https://nicolasroger16.github.io/MOVECHECK' }}" \
            PRACTITIONER_EMAIL="${{ secrets.PRACTITIONER_EMAIL || 'nicolasroger16@gmail.com' }}" \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Déployer les fonctions
        run: |
          for fn in stripe-webhook get-code get-bilan get-upload-url submit-filmage; do
            supabase functions deploy "$fn" --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          done
